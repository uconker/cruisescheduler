<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Group Cruise Planner (July-Sept 2026)</title>
    <!-- Include Tailwind CSS for quick styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Include Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .date-badge {
            transition: all 0.2s ease;
        }
        .date-badge:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans p-6 md:p-12">

    <div class="max-w-6xl mx-auto">
        <header class="mb-10 text-center">
            <h1 class="text-4xl font-extrabold text-blue-900 mb-2 flex items-center justify-center gap-3">
                <i data-lucide="ship" class="w-10 h-10 text-blue-600"></i>
                Summer 2026 Cruise Planner
            </h1>
            <p class="text-lg text-gray-600">Mediterranean Deals (6-9 Days)</p>
        </header>

        <!-- Loading State -->
        <div id="loading" class="text-center py-12">
            <i data-lucide="loader-2" class="w-12 h-12 animate-spin text-blue-500 mx-auto mb-4"></i>
            <p class="text-gray-500 text-lg">Fetching latest deals...</p>
        </div>

        <!-- Error State -->
        <div id="error" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative text-center" role="alert">
            <strong class="font-bold">Oops!</strong>
            <span class="block sm:inline"> Could not load cruise data. Make sure 'cruises.json' exists.</span>
        </div>

        <!-- Main Content Grid -->
        <div id="cruise-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 hidden">
            <!-- Cruise cards will be injected here -->
        </div>
    </div>

    <script>
        // Initialize Lucide icons
        lucide.createIcons();

        // Fetch data from our JSON file
        fetch('cruises.json')
            .then(response => {
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                return response.json();
            })
            .then(cruises => {
                const container = document.getElementById('cruise-container');
                const loading = document.getElementById('loading');
                
                loading.classList.add('hidden');
                container.classList.remove('hidden');

                if (cruises.length === 0) {
                    container.innerHTML = '<p class="col-span-full text-center text-gray-500 text-xl py-10">No cruises found in the database.</p>';
                    return;
                }

                cruises.forEach(cruise => {
                    // Create Date Badge (Flat list formatting)
                    let dateHtml = '';
                    if (cruise.date) {
                        dateHtml = `<span class="date-badge inline-block bg-blue-100 text-blue-800 text-xs px-2 py-1 rounded-full border border-blue-200 shadow-sm cursor-pointer">${cruise.date}</span>`;
                    } else {
                        dateHtml = `<span class="text-sm text-gray-500 italic">Unknown</span>`;
                    }

                    // Format Pricing
                    let priceHtml = '';
                    if (cruise.prices_per_person && cruise.prices_per_person['2_adults']) {
                        priceHtml = `
                            <div class="mt-4 text-center border-t border-gray-100 pt-4">
                                <div class="bg-blue-50 p-3 rounded-lg border border-blue-100">
                                    <p class="text-xs text-blue-600 uppercase tracking-wider mb-1 font-semibold">Exact Date Price (2 Adults)</p>
                                    <p class="text-2xl font-bold text-blue-900">€${cruise.prices_per_person['2_adults']}<span class="text-sm font-normal text-blue-700"> p.P.</span></p>
                                </div>
                            </div>
                        `;
                    }

                    const card = document.createElement('div');
                    card.className = 'bg-white rounded-xl shadow-md hover:shadow-xl transition-shadow duration-300 border border-gray-100 overflow-hidden flex flex-col h-full';
                    
                    card.innerHTML = `
                        <div class="bg-gradient-to-r from-blue-500 to-cyan-600 p-4 text-white">
                            <h3 class="font-bold text-lg leading-tight mb-1">${cruise.title}</h3>
                            <p class="text-blue-100 text-sm flex items-center gap-1">
                                <i data-lucide="anchor" class="w-4 h-4"></i> ${cruise.ship}
                            </p>
                        </div>
                        
                        <div class="p-5 flex-grow flex flex-col justify-between">
                            <div>
                                <div class="flex items-center gap-2 mb-3 text-sm text-gray-600">
                                    <i data-lucide="clock" class="w-4 h-4"></i>
                                    <span>${cruise.duration_days} Days &bull; ${cruise.cabin_type || 'Cabin TBD'}</span>
                                </div>
                                
                                <div class="mb-4">
                                    <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Departure Date:</p>
                                    <div class="flex flex-wrap gap-2">
                                        ${dateHtml}
                                    </div>
                                </div>

                                <div class="mb-4">
                                     <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1 flex items-center gap-1">
                                        <i data-lucide="map-pin" class="w-3 h-3"></i> Route
                                     </p>
                                    <p class="text-sm text-gray-600 line-clamp-2" title="${cruise.ports}">${cruise.ports}</p>
                                </div>
                            </div>
                            
                            <div>
                                ${priceHtml}
                                
                                <a href="${cruise.url}" target="_blank" rel="noopener noreferrer" class="mt-5 w-full block text-center bg-white hover:bg-gray-50 text-blue-600 font-semibold py-2 px-4 border border-blue-200 rounded-lg shadow-sm transition-colors duration-200">
                                    View Full Itinerary &rarr;
                                </a>
                                <p class="text-[10px] text-gray-400 mt-2 text-center">Last checked: ${cruise.updated_at}</p>
                            </div>
                        </div>
                    `;
                    container.appendChild(card);
                });
                // Re-initialize icons for newly added DOM elements
                lucide.createIcons();
            })
            .catch(error => {
                console.error('Error fetching data:', error);
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('error').classList.remove('hidden');
            });
    </script>
</body>
</html>
